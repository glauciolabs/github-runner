name: production

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  packages: write
  security-events: write

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_mode:
        description: Pipeline mode
        type: choice
        required: true
        default: build_and_push
        options:
          - build_and_push
          - build_only
          - deploy_only
      container_registry:
        description: container registry
        type: choice
        required: true
        default: github
        options:
          - dockerhub
          - github
      deploy:
        description: deploy?
        required: true
        default: true
        type: boolean
      gitops_engine:
        description: GitOps engine
        type: choice
        required: true
        default: argocd
        options:
          - argocd
          - fluxcd

jobs:
  pipeline:
    uses: glauciolabs/core-pipeline/.github/workflows/core-pipeline.yml@develop
    with:
      workflow_type: containers
      docker_context: '.github/infra/container'
      dockerfile_path: '.github/infra/container/Dockerfile'
      docker_platforms: 'linux/amd64,linux/arm64'
      pipeline_mode: ${{ inputs.build_mode || 'build_and_push' }}
      container_registry: ${{ inputs.container_registry || 'github' }}
      gitops_engine: ${{ inputs.gitops_engine || 'argocd' }}
      deploy: ${{ inputs.deploy || true }}
      argocd_deployment_mode: kustomize
      kustomization_overlay: false
    secrets: inherit

  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [pipeline]
    if: ${{ always() }}
    steps:
      - name: Send notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          STATUS: ${{ needs.pipeline.result }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set. Skipping notification."
            exit 0
          fi
          run_url="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          text="Workflow: ${WORKFLOW_NAME}%0ARepo: ${REPO}%0ABranch: ${REF_NAME}%0AStatus: ${STATUS}%0ARun: ${run_url}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
