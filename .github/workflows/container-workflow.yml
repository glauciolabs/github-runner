name: production

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: pipeline mode
        type: choice
        required: true
        default: build_and_push
        options:
          - build_and_push
          - build_only
      container_registry:
        description: pipeline mode
        type: choice
        required: true
        default: github
        options:
          - dockerhub
          - github
      deploy:
        description: deploy?
        required: true
        default: true
        type: boolean
      gitops_engine:
        description: gitops engine?
        type: choice
        required: true
        default: argocd
        options:
          - argocd
          - fluxcd

jobs:
  pipeline:
    uses: glauciolabs/core-pipeline/.github/workflows/core-pipeline.yml@feat/new-pipeline
    with:
      workflow_type: containers
      pipeline_mode: ${{ inputs.pipeline_mode }}
      container_registry: ${{ inputs.container_registry }}
      gitops_engine: ${{ inputs.gitops_engine }}
      deploy: ${{ inputs.deploy }}
      argocd_deployment_mode: kustomize
      kustomization_overlay: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      REGISTRY: ${{ inputs.container_registry }}
      REGISTRY_USERNAME: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ github.token }}
      GIT_REGISTRY_TOKEN: ${{ secrets.GIT_REGISTRY_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
      GITOPS_SSH_PRIVATE_KEY: ${{ secrets.GITOPS_SSH_PRIVATE_KEY }}
      CLUSTER_DEVELOP: ${{ secrets.CLUSTER_DEVELOP }}
      CLUSTER_PRODUCTION: ${{ secrets.CLUSTER_PRODUCTION }}